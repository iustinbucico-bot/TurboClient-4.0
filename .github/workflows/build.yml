name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.10.2
      - name: Build with Gradle
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: build/libs/*.jar
